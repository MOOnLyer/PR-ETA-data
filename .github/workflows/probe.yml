name: Probe alternate sources
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          u="https://www.uscis.gov/green-card/green-card-processes-and-procedures/visa-availability-priority-dates/adjustment-of-status-filing-charts-from-the-visa-bulletin"
          code=$(curl -s -o /tmp/u.html -w "%{http_code}" -L -A "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)" --max-time 60 "$u")
          echo "PROBE uscis=$code size=$(stat -c%s /tmp/u.html)"
          echo "PROBE months_found: $(grep -oiE '(January|February|March|April|May|June|July|August|September|October|November|December) 20[0-9]{2}' /tmp/u.html | sort -u | tr '\n' ' ')"
