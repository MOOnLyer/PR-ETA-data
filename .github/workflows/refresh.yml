# Refreshes the three public dataset JSONs daily and commits any changes.
#
# This repo is the public data mirror for the private PR ETA app: its raw URLs
# (raw.githubusercontent.com/MOOnLyer/PR-ETA-data/main/*.json) are what the app's in-app
# updater reads. No credentials — the built-in GITHUB_TOKEN commits to this same repo.
#
# Runs daily: the three government sources each publish about monthly but on an
# unpredictable day, so a daily poll catches new figures within 24h. Runs are cheap and
# gentle on the sources — each scraper fetches only what's new: the Visa Bulletin page
# cache re-fetches only genuinely new months, and MOJ/ISA re-download just the index
# months missing from the dataset plus a short restatement recheck. Almost every run
# finds nothing new, passes the regression gate, and commits nothing.
#
# Once a month (the 1st) the otherwise-immutable Visa Bulletin cache drops its trailing
# 24 months so State's corrections to recent bulletins are re-fetched; a manual run with
# full_refresh=true re-downloads the whole cache. Also triggerable from the Actions tab.

name: Refresh datasets

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "Re-download ALL cached Visa Bulletin pages, not just the trailing window"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Restore Visa Bulletin page cache
        uses: actions/cache@v6
        with:
          path: .cache/vb
          key: visa-bulletin-pages-${{ github.run_id }}
          restore-keys: visa-bulletin-pages-

      # The page cache is immutable, so State's corrections to an already-cached bulletin
      # are otherwise never seen. Once a month, drop the trailing 24 months (where such
      # corrections realistically land) so the fetch below re-downloads them; a manual
      # run with full_refresh=true drops the whole cache. Ordinary daily runs keep it.
      - name: Revalidate recent bulletin pages
        run: |
          python3 scripts/revalidate_vb_cache.py --self-test
          if [ "${{ github.event.inputs.full_refresh }}" = "true" ]; then
            python3 scripts/revalidate_vb_cache.py --cache-dir .cache/vb --all
          elif [ "$(date -u +%d)" = "01" ]; then
            python3 scripts/revalidate_vb_cache.py --cache-dir .cache/vb --months 24
          else
            echo "Daily incremental: keeping cached bulletin pages."
          fi

      - name: Refresh U.S. Visa Bulletin
        run: |
          python3 scripts/fetch_visa_bulletin.py --self-test
          END=$(date -u -d "+6 months" +%Y-%m)
          python3 scripts/fetch_visa_bulletin.py --start 2001-12 --end "$END" \
            --cache-dir .cache/vb --out us_visa_bulletin.json

      - name: Refresh Japan flow (MOJ monthly Excel)
        run: |
          python3 scripts/fetch_moj_monthly.py --self-test
          python3 scripts/fetch_moj_monthly.py --months incremental \
            --merge-into japan_monthly_stats.json

      - name: Refresh ISA processing periods
        run: |
          python3 -m pip install --quiet pdfplumber
          python3 scripts/fetch_isa_periods.py --self-test
          python3 scripts/fetch_isa_periods.py --merge-into japan_processing_periods.json

      # A partial fetch (site flake) would shrink a blind-written file; restore any dataset
      # that lost records so the run commits only the datasets that genuinely grew and
      # never propagates a regression to app installs.
      - name: Guard against dataset regressions
        run: |
          python3 scripts/check_dataset_regression.py --self-test
          python3 scripts/check_dataset_regression.py --revert \
            us_visa_bulletin.json japan_monthly_stats.json japan_processing_periods.json

      - name: Commit and push if changed
        run: |
          if git diff --quiet; then
            echo "Datasets unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898270+github-actions[bot]@users.noreply.github.com"
          git add us_visa_bulletin.json japan_monthly_stats.json japan_processing_periods.json
          git commit -m "Refresh datasets (automated)"
          git push
